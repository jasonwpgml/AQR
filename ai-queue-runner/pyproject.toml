[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ai-queue-runner"
version = "0.1.0"
description = "Local task queue scheduler that dispatches work to Claude and Codex CLIs"
requires-python = ">=3.12,<3.15"
dependencies = [
    "APScheduler>=3.11.3,<4",
    "PySide6~=6.11.1",
    "psutil>=5.9",
    "pydantic>=2.7",
    "sqlalchemy>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5",
    "ruff>=0.4",
]
build = [
    "pyinstaller==6.21.0",
    "pyinstaller-hooks-contrib==2026.6",
]

[project.scripts]
ai-queue-runner = "ai_queue_runner.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_queue_runner"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.coverage.run]
source = ["ai_queue_runner"]

[tool.coverage.report]
show_missing = true
skip_covered = false
